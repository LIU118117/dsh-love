<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <!-- dsh-love: 圆胖小鲸鱼顶着爱心（原创简笔） -->
  <g>
    <!-- 尾巴 -->
    <path d="M100 70 q15-13 28-9 q-5 11 -14 15 q10 3 12 12 q-15 -1 -24 -9 z" fill="#2563eb"/>
    <!-- 背鳍 -->
    <path d="M60 48 q3-15 14-18 q3 13 -6 19 z" fill="#2563eb"/>
    <!-- 身体 -->
    <ellipse cx="62" cy="74" rx="40" ry="25" fill="#3b82f6"/>
    <circle cx="33" cy="66" r="23" fill="#3b82f6"/>
    <!-- 肚皮 -->
    <path d="M40 78 q-6 12 4 16 q16 5 28 0 q12 5 26 0 q7-4 4-14 q-3-9-14-9 q-14 0-22 7 q-9-7-22-7 q-10 0-14 9 z" fill="#dbeafe"/>
    <!-- 眼睛 -->
    <circle cx="32" cy="60" r="4.4" fill="#0f172a"/>
    <circle cx="33.5" cy="58.6" r="1.5" fill="#ffffff"/>
    <!-- 微笑 -->
    <path d="M26 70 q4 4 9 3" stroke="#0f172a" stroke-width="2" fill="none" stroke-linecap="round"/>
    <!-- 腮红 -->
    <ellipse cx="46" cy="72" rx="6" ry="3.6" fill="#fca5a5" opacity="0.8"/>
    <!-- 爱心 -->
    <path d="M82 14 c-4-6-11-8-16-4 -4 3 -6 9 -3 13 3 5 11 10 19 16 8-6 16-11 19-16 3-4 1-10-3-13 -5-4-12-2-16 4 z" fill="#f472b6"/>
    <!-- 小心心 -->
    <path d="M106 40 c-2-3-6-4-8-2 -2 1-3 4-2 6 1 2 5 5 10 8 4-3 8-6 10-8 1-2 0-5-2-6 -3-2-6-1-8 2 z" fill="#fda4af"/>
  </g>
</svg>
